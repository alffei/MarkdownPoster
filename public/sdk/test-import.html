<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MarkdownPoster Import Test</title>
    <style>
      :root {
        color-scheme: light;
      }
      body {
        margin: 0;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        background: #f4f4f7;
        color: #202225;
      }
      .wrap {
        max-width: 980px;
        margin: 28px auto;
        padding: 0 16px 28px;
      }
      .panel {
        background: #fff;
        border: 1px solid #e7e7ee;
        border-radius: 12px;
        padding: 16px;
        box-shadow: 0 12px 30px rgba(8, 10, 20, 0.06);
      }
      h1 {
        margin: 0 0 14px;
        font-size: 22px;
      }
      p.note {
        margin: 0 0 14px;
        color: #606578;
        font-size: 13px;
      }
      .row {
        display: flex;
        gap: 10px;
        align-items: center;
        flex-wrap: wrap;
        margin-bottom: 10px;
      }
      label {
        font-size: 13px;
        color: #4b5163;
      }
      input[type="text"] {
        width: 420px;
        max-width: 100%;
        border: 1px solid #d9dbe8;
        border-radius: 8px;
        padding: 8px 10px;
        font-size: 13px;
      }
      textarea {
        width: 100%;
        min-height: 380px;
        border: 1px solid #d9dbe8;
        border-radius: 10px;
        padding: 12px;
        font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
        font-size: 13px;
        line-height: 1.55;
        resize: vertical;
        box-sizing: border-box;
      }
      .actions {
        display: flex;
        gap: 8px;
        flex-wrap: wrap;
        margin-top: 12px;
      }
      button {
        border: 0;
        border-radius: 8px;
        padding: 9px 12px;
        cursor: pointer;
        font-size: 13px;
        font-weight: 600;
      }
      button.primary {
        background: #1f6feb;
        color: #fff;
      }
      button.secondary {
        background: #eef1f9;
        color: #2e3a59;
      }
      pre {
        margin: 12px 0 0;
        background: #131722;
        color: #d2dcff;
        border-radius: 10px;
        padding: 12px;
        font-size: 12px;
        overflow: auto;
      }
      .small {
        font-size: 12px;
        color: #5d6376;
      }
    </style>
  </head>
  <body>
    <div class="wrap">
      <div class="panel">
        <h1>MarkdownPoster External Import Test</h1>
        <p class="note">
          This page simulates a third-party site. Click the button to open your editor in a new tab and import markdown.
        </p>

        <div class="row">
          <label for="targetOrigin">Target Origin</label>
          <input id="targetOrigin" type="text" />
        </div>
        <div class="row">
          <label for="importPath">Import Path</label>
          <input id="importPath" type="text" value="/import" />
        </div>

        <textarea id="markdownInput"># MarkdownPoster Import Smoke Test

This content is sent from an external page.

## Features to verify

- opens a new tab
- imports markdown into editor
- handles URL mode and postMessage mode
- shows import status notice

> If this appears in your editor, import is working.
</textarea>

        <div class="actions">
          <button id="openBtn" class="primary">Open MarkdownPoster</button>
          <button id="shortBtn" class="secondary">Load Short Sample</button>
          <button id="longBtn" class="secondary">Load Long Sample (~10k chars)</button>
          <button id="hugeBtn" class="secondary">Load Huge Sample (>200KB)</button>
        </div>

        <pre id="resultBox">Result: (not started)</pre>
        <p class="small">SDK file: <code>/sdk/markdownposter-open.v1.js</code></p>
      </div>
    </div>

    <script src="http://rrzxs.com/mdp/sdk/markdownposter-open.v1.js"></script>
    <script>
      const input = document.getElementById("markdownInput");
      const targetOriginInput = document.getElementById("targetOrigin");
      const importPathInput = document.getElementById("importPath");
      const resultBox = document.getElementById("resultBox");

      targetOriginInput.value = window.location.origin;

      function setResult(result) {
        resultBox.textContent = "Result: " + JSON.stringify(result, null, 2);
      }

      document.getElementById("openBtn").addEventListener("click", async () => {
        if (!window.MarkdownPoster || typeof window.MarkdownPoster.open !== "function") {
          setResult({ ok: false, code: "sdk_missing", message: "MarkdownPoster.open is missing" });
          return;
        }
        const result = await window.MarkdownPoster.open({
          markdown: input.value,
          source: window.location.origin,
          targetOrigin: targetOriginInput.value.trim() || window.location.origin,
          importPath: importPathInput.value.trim() || "/import"
        });
        setResult(result);
      });

      document.getElementById("shortBtn").addEventListener("click", () => {
        input.value = [
          "# Short Sample",
          "",
          "This should usually go through URL mode.",
          "",
          "- line 1",
          "- line 2",
          "- line 3"
        ].join("\n");
      });

      document.getElementById("longBtn").addEventListener("click", () => {
        const line = "Long markdown line for import verification.\n";
        input.value = "# Long Sample\n\n" + line.repeat(320);
      });

      document.getElementById("hugeBtn").addEventListener("click", () => {
        const line = "Huge markdown line for threshold test.\n";
        input.value = "# Huge Sample\n\n" + line.repeat(8500);
      });
    </script>
  </body>
  </html>
